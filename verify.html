<title>Member Verification · ALSA Auckland</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }

  html, body {
    min-height: 100%;
    background: #0a0a0a;
    font-family: 'Lora', Georgia, serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 420px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
  }

  /* Logo */
  .logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    margin-bottom: 28px;
  }

  /* Verified seal */
  .seal {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid #C9A84C;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    flex-shrink: 0;
  }

  .seal svg {
    width: 32px;
    height: 32px;
  }

  /* Status */
  .status-label {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(201,168,76,0.8);
    margin-bottom: 16px;
  }

  .status-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 32px;
  }

  /* Member card */
  .member-card {
    width: 100%;
    border: 0.5px solid rgba(255,255,255,0.1);
    padding: 24px;
    margin-bottom: 28px;
    text-align: left;
  }

  .member-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
  }

  .member-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .member-row:first-child {
    padding-top: 0;
  }

  .row-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  .row-value {
    font-size: 14px;
    color: #fff;
    font-weight: 600;
    text-align: right;
    max-width: 60%;
  }

  .row-value.gold {
    color: #C9A84C;
  }

  /* Footer note */
  .note {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    line-height: 1.8;
    margin-bottom: 24px;
  }

  /* ALSA link */
  .alsa-link {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    border-bottom: 1px solid rgba(201,168,76,0.3);
    padding-bottom: 2px;
  }

  .alsa-link:hover {
    color: #C9A84C;
  }

  /* Invalid state */
  .invalid {
    text-align: center;
    padding: 20px;
  }

  .invalid h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #fff;
    margin-bottom: 12px;
  }

  .invalid p {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    line-height: 1.7;
  }

  /* Divider */
  .divider {
    width: 100%;
    height: 0.5px;
    background: rgba(255,255,255,0.08);
    margin: 28px 0;
  }
</style>
</head>
